<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Pritam 🎂</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 35%,#352515 0%,#110d0a 45%,#030303 100%);
  color:white;
}

/* CINEMATIC LIGHT */
.room-light{
  position:fixed;
  inset:0;
  background:radial-gradient(
    ellipse at 50% 30%,
    rgba(255,190,80,.18),
    transparent 55%
  );
  pointer-events:none;
}

/* SCENE */
.scene{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:20px;
}

/* TITLE */
.title{
  font-size:clamp(28px,7vw,58px);
  letter-spacing:3px;
  text-align:center;
  margin-bottom:35px;
  text-shadow:0 0 25px rgba(255,190,80,.7);
}

/* CAKE */
.cake{
  position:relative;
  width:min(330px,80vw);
  height:220px;
  margin-top:35px;
}

/* CAKE BODY */
.layer{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  height:85px;
  border-radius:18px;
  background:
    linear-gradient(145deg,#111,#292929 45%,#050505);
  border:2px solid #c79b45;
  box-shadow:
    0 15px 35px rgba(0,0,0,.8),
    inset 0 0 20px rgba(255,210,120,.12);
}

.layer.bottom{
  bottom:0;
}

.layer.top{
  bottom:65px;
  width:88%;
  height:75px;
}

/* GOLD DETAIL */
.gold-line{
  position:absolute;
  left:7%;
  right:7%;
  height:4px;
  background:linear-gradient(90deg,#8a6424,#ffe39a,#8a6424);
  border-radius:5px;
}

.gold-line.one{
  bottom:55px;
}

.gold-line.two{
  bottom:130px;
}

/* CANDLES */
.candles{
  position:absolute;
  bottom:138px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:24px;
}

.candle{
  width:14px;
  height:55px;
  border-radius:4px;
  background:linear-gradient(90deg,#d6a84c,#fff0a8,#b47b20);
  position:relative;
}

/* FLAME */
.flame{
  position:absolute;
  width:18px;
  height:27px;
  left:50%;
  top:-27px;
  transform:translateX(-50%);
  background:radial-gradient(circle at 50% 70%,#fff 0 15%,#ffd34e 35%,#ff7b00 65%,transparent 70%);
  border-radius:50% 50% 50% 50%;
  filter:drop-shadow(0 0 10px #ffae00);
  animation:flicker .15s infinite alternate;
}

@keyframes flicker{
  from{transform:translateX(-50%) scale(1);}
  to{transform:translateX(-50%) scale(.88,1.08);}
}

/* SMOKE */
.smoke{
  display:none;
  position:absolute;
  top:-55px;
  left:50%;
  width:20px;
  height:70px;
  transform:translateX(-50%);
  background:linear-gradient(transparent,rgba(220,220,220,.35),transparent);
  filter:blur(7px);
  border-radius:50%;
  animation:smokeUp 2.5s ease-out forwards;
}

@keyframes smokeUp{
  0%{
    opacity:.7;
    transform:translate(-50%,0) scale(.7);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-90px) scale(2);
  }
}

/* BUTTON */
.blow-btn{
  margin-top:55px;
  padding:15px 28px;
  border:none;
  border-radius:50px;
  font-size:16px;
  font-weight:bold;
  color:#17110a;
  background:linear-gradient(135deg,#ffe39a,#c99738);
  box-shadow:0 0 25px rgba(255,200,80,.3);
  cursor:pointer;
}
.next-btn{
  margin-top:25px;
  padding:14px 32px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ffe39a,#b98227);
  color:#17110a;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,200,80,.3);
}

.next-btn:active{
  transform:scale(.94);
}
.blow-btn:active{
  transform:scale(.95);
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:9px;
  height:14px;
  top:-20px;
  animation:fall 3s linear forwards;
  z-index:10;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* FIREWORK */
.firework{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ffd86a;
  box-shadow:
    0 0 15px #ffd86a,
    0 0 35px #ff9d00;
  animation:boom 1.4s ease-out forwards;
  z-index:5;
}

@keyframes boom{
  0%{
    transform:scale(.2);
    opacity:1;
  }
  100%{
    transform:scale(15);
    opacity:0;
  }
}

/* FINAL */
.final{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:rgba(0,0,0,.35);
  z-index:20;
}

.final h1{
  font-size:clamp(35px,9vw,80px);
  color:#ffe49a;
  text-shadow:0 0 30px #ffb300;
}

.final p{
  margin-top:15px;
  font-size:20px;
}
  /* =========================
   SCENE 3 - PRITAM FILES
========================= */

.pritam-files{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;

  background:
    radial-gradient(circle at center,
      rgba(70,48,20,.25),
      rgba(3,3,3,.98) 70%);

  color:white;
}

.files-warning{
  font-size:clamp(25px,7vw,55px);
  font-weight:800;
  letter-spacing:3px;

  opacity:0;
  transform:translateY(20px);

  animation:filesWarning 1s ease forwards;
}

.files-subtitle{
  margin-top:12px;
  color:#cfcfcf;
  font-size:16px;

  opacity:0;
  animation:filesSubtitle 1s ease 1s forwards;
}

.file-box{
  width:min(390px,90vw);
  margin-top:35px;
  padding:35px 25px;

  border:1px solid rgba(212,168,76,.45);
  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(35,35,35,.92),
      rgba(8,8,8,.96)
    );

  box-shadow:
    0 0 50px rgba(212,168,76,.12),
    inset 0 0 30px rgba(255,255,255,.03);

  opacity:0;
  transform:scale(.8);

  animation:fileBoxAppear 1s ease 2s forwards;
}

.folder-icon{
  font-size:65px;
  margin-bottom:10px;
  filter:drop-shadow(0 0 15px rgba(255,190,60,.4));
}

.file-box h1{
  font-size:clamp(25px,7vw,40px);
  letter-spacing:2px;
  color:#f1d58a;

  text-shadow:
    0 0 15px rgba(241,213,138,.35);
}

.confidential{
  display:inline-block;
  margin-top:12px;
  padding:6px 13px;

  border:1px solid #9e2424;
  border-radius:5px;

  color:#ff7d7d;
  font-size:12px;
  letter-spacing:3px;
}

.file-box p{
  margin-top:25px;
  color:#bbb;
}

.file-box button{
  margin-top:25px;
  padding:14px 26px;

  border:none;
  border-radius:30px;

  background:
    linear-gradient(135deg,#f4d78d,#a87925);

  color:#17110a;
  font-weight:800;
  font-size:15px;

  cursor:pointer;

  box-shadow:
    0 0 25px rgba(225,180,75,.25);
}

.file-box button:active{
  transform:scale(.94);
}

@keyframes filesWarning{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes filesSubtitle{
  to{
    opacity:1;
  }
}

@keyframes fileBoxAppear{
  to{
    opacity:1;
    transform:scale(1);
  }
}
  /* =========================
   SCENE 4 - PASSWORD ACCESS
========================= */

.access-screen{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;

  background:
    radial-gradient(circle at center,
      rgba(30,70,45,.18),
      rgba(2,2,2,.98) 72%);

  color:white;
}

.access-icon{
  font-size:70px;
  margin-bottom:20px;
}

.access-screen h1{
  font-size:clamp(30px,8vw,52px);
  letter-spacing:3px;
  color:#8ff0b0;

  text-shadow:
    0 0 20px rgba(80,255,150,.35);
}

.access-text{
  margin-top:12px;
  color:#aaa;
  font-size:14px;
  letter-spacing:2px;
}

.password-box{
  width:min(330px,85vw);
  margin-top:30px;
  padding:25px;

  border:1px solid rgba(143,240,176,.25);
  border-radius:20px;

  background:rgba(15,15,15,.92);

  box-shadow:
    0 0 40px rgba(80,255,150,.08);
}

.password-box input{
  width:100%;
  box-sizing:border-box;

  padding:14px;
  border:none;
  outline:none;

  border-radius:12px;
  text-align:center;

  background:#222;
  color:white;

  font-size:18px;
  letter-spacing:5px;
}

.unlock-btn{
  margin-top:18px;
  padding:13px 28px;

  border:none;
  border-radius:30px;

  background:linear-gradient(135deg,#b8ffd0,#58c987);

  color:#102018;
  font-weight:800;
  font-size:15px;

  cursor:pointer;
}

.unlock-btn:active{
  transform:scale(.94);
}

.password-error{
  margin-top:12px;
  color:#ff7777;
  font-size:13px;
  display:none;
}
</style>
</head>

<body>

<div class="room-light"></div>

<div class="scene">

  <div class="title">
    🎂 Birthday Cake for Pritam 🎂
  </div>

  <div class="cake">

    <div class="layer bottom"></div>
    <div class="layer top"></div>

    <div class="gold-line one"></div>
    <div class="gold-line two"></div>

    <div class="candles">

      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

    </div>

  </div>

<button class="blow-btn" id="startMic" onclick="startBlowDetection()">
  🎤 Blow the Candles
</button>
</div>

<div class="final" id="final">
  <h1>HAPPY BIRTHDAY<br>PRITAM ❤️</h1>

  <p>🎊🎆 Budhbak ka birthday hai! 🎆🎊</p>

  <button onclick="openPritamFiles()" class="next-btn">
    NEXT →
  </button>
</div>
<div class="pritam-files" id="pritamFiles">

  <div class="files-warning">
    ⚠️ WAIT...
  </div>

  <div class="files-subtitle">
    We found some suspicious evidence... 👀
  </div>

  <div class="file-box">

    <div class="folder-icon">
      📁
    </div>

    <h1>THE PRITAM FILES</h1>

    <div class="confidential">
      CONFIDENTIAL 🔒
    </div>
    <p>
      Case Subject: <strong>PRITAM</strong>
    </p>

    <button onclick="openAccessScreen()">
  🔓 OPEN FILE
</button>

  </div>

</div>
  <!-- SCENE 4 - PASSWORD ACCESS -->

<div class="access-screen" id="accessScreen">

  <div class="access-icon">🔐</div>

  <h1>ACCESS REQUIRED</h1>

  <div class="access-text">
    PRIVATE FILE • PRITAM
  </div>

  <div class="password-box">

    <input
      type="password"
      id="passwordInput"
      maxlength="4"
      placeholder="ENTER PASSWORD"
      inputmode="numeric"
    >

    <button class="unlock-btn" onclick="unlockPritam()">
      🔓 UNLOCK
    </button>

    <div class="password-error" id="passwordError">
      ❌ WRONG PASSWORD
    </div>

  </div>

</div>
<script>

function blowCandles(){

  /* Flames OFF */
  document.querySelectorAll(".flame")
    .forEach(flame => flame.style.display="none");

  /* Smoke ON */
  document.querySelectorAll(".smoke")
    .forEach(smoke => smoke.style.display="block");

  /* Hide button */
  document.querySelector(".blow-btn").style.display="none";

  /* Confetti */
  for(let i=0;i<100;i++){
    let c=document.createElement("div");
    c.className="confetti";

    c.style.left=Math.random()*100+"vw";
    c.style.animationDelay=Math.random()*1.5+"s";

    let colors=[
      "#ffd166",
      "#ff6b6b",
      "#06d6a0",
      "#4dabf7",
      "#f72585"
    ];

    c.style.background=
      colors[Math.floor(Math.random()*colors.length)];

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),4500);
  }

  /* Fireworks */
  for(let i=0;i<12;i++){

    setTimeout(()=>{

      let f=document.createElement("div");
      f.className="firework";

      f.style.left=(10+Math.random()*80)+"vw";
      f.style.top=(10+Math.random()*45)+"vh";

      document.body.appendChild(f);

      setTimeout(()=>f.remove(),1500);

    },i*180);
  }

  /* Final message */
  setTimeout(()=>{
    document.getElementById("final").style.display="flex";
  },2200);

}
async function startBlowDetection() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    const microphone = audioContext.createMediaStreamSource(stream);

    analyser.fftSize = 512;
    microphone.connect(analyser);

    const data = new Uint8Array(analyser.fftSize);

    document.getElementById("startMic").innerText = "💨 Blow now...";

    let strongSound = 0;

    function detectBlow() {
      analyser.getByteTimeDomainData(data);

      let sum = 0;

      for (let i = 0; i < data.length; i++) {
        const value = (data[i] - 128) / 128;
        sum += value * value;
      }

      const volume = Math.sqrt(sum / data.length);

      if (volume > 0.12) {
        strongSound++;
      } else {
        strongSound = 0;
      }

      if (strongSound >= 3) {
        stream.getTracks().forEach(track => track.stop());
        audioContext.close();

        blowCandles();
        return;
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();

  } catch (error) {
    alert("Microphone permission allow karo 🎤");
  }
function openPritamFiles(){
  document.getElementById("final").style.display="none";
  document.getElementById("pritamFiles").style.display="flex";
}
function unlockPritam(){

  const password = document.getElementById("passwordInput").value;

  if(password === "2408"){

    document.getElementById("accessScreen").style.display = "none";

    alert("ACCESS GRANTED 🔓");

  }else{

    document.getElementById("passwordError").style.display = "block";

  }

function openAccessScreen(){

  document.getElementById("pritamFiles").style.display = "none";
  document.getElementById("accessScreen").style.display = "flex";

}

</script>
</body>
</html>
